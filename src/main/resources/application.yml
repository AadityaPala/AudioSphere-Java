
server:
  port: ${PORT:8080}

spring:
  application:
    name: audiosphere-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "${CAS_URL}"

# Python recommendation service
python:
  service:
    url: ${PYTHON_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: audiosphere-api